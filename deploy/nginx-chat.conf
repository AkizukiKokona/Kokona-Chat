# Kokona Chat —— nginx 反代片段
#
# 用法：
#   1) 把 map 块放到 http 上下文（Debian 下 /etc/nginx/conf.d/chat-upgrade.conf）
#   2) 把两个 location 放进对应站点的 server 块
#
# 三个关键点：
#   - WebSocket 需要透传 Upgrade / Connection 头
#   - SSE 必须关掉 buffering，否则消息不会实时到
#   - 长连接要放宽 read/send 超时

# --- 放到 http 级 ---
map $http_upgrade $conn_upgrade_chat {
    default upgrade;
    ''      close;
}

# --- 放到 server 级 ---
location = /chat {
    return 301 /chat/;
}

location /chat/ {
    proxy_pass http://127.0.0.1:8299;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade_chat;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
